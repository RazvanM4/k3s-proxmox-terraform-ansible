---
- name: Join k3s worker node to control plane
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL="https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443" \
      K3S_TOKEN="{{ k3s_cluster_token }}" \
      sh -s - agent
  args:
    creates: /usr/local/bin/k3s-agent-uninstall.sh
