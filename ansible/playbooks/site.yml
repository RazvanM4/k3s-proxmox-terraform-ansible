---
- name: Prepare cluster prerequisites
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_prereqs

- name: Bootstrap primary and HA k3s control-plane nodes
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s worker nodes
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Bootstrap GitOps controller (Argo CD)
  hosts: k3s_server[0]
  become: true
  roles:
    - argocd_bootstrap
