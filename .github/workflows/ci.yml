name: Infrastructure Lint & Validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init & validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  ansible-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-lint and yamllint
        run: pip install ansible-lint yamllint ansible-core
      - name: Lint YAML & Ansible playbooks
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" ansible/
          ansible-galaxy collection build ansible/ --output-path ./artifacts

      - name: Upload Ansible collection tarball
        uses: actions/upload-artifact@v4
        with:
          name: ansible-collection-tarball
          path: artifacts/*.tar.gz
